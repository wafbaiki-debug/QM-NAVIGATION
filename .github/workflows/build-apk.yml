
name: Build QM NAVIGASI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -q QM-NAVIGASI-Android-CloudBuild-DIAGNOSTIC.zip -d buildsrc

      - name: Fix Kotlin single-line property
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: sed -i 's/singleLine = true/isSingleLine = true/' app/src/main/java/com/nav3dmalaysia/MainActivity.kt

      - name: Build APK
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QM-NAVIGASI-debug-apk
          path: buildsrc/QM-NAVIGASI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
