                  nextTurnText = TextView(this).apply {
          """,
              "metrics and route legend",
          )
          replace_once(
              "        bottomPanel.addView(statusText, LinearLayout.LayoutParams(-1, -2))\n        bottomPanel.addView(nextTurnText, LinearLayout.LayoutParams(-1, -2))\n",
              "        bottomPanel.addView(statusText, LinearLayout.LayoutParams(-1, -2))\n        bottomPanel.addView(metricsText, LinearLayout.LayoutParams(-1, -2))\n        bottomPanel.addView(nextTurnText, LinearLayout.LayoutParams(-1, -2))\n        bottomPanel.addView(routeLegendText, LinearLayout.LayoutParams(-1, -2))\n",
              "bottom panel rows",
          )
          replace_once(
              '            style.addSource(GeoJsonSource(ROUTE_SOURCE, EMPTY_FEATURE_COLLECTION))\n            style.addSource(GeoJsonSource(CAMERA_SOURCE, EMPTY_FEATURE_COLLECTION))\n',
              '            style.addSource(GeoJsonSource(ROUTE_SOURCE, EMPTY_FEATURE_COLLECTION))\n            style.addSource(GeoJsonSource(TURN_SOURCE, EMPTY_FEATURE_COLLECTION))\n            style.addSource(GeoJsonSource(CAMERA_SOURCE, EMPTY_FEATURE_COLLECTION))\n',
              "turn marker source",
          )
          replace_once(
              """            style.addLayer(
                          LineLayer(ROUTE_LAYER, ROUTE_SOURCE).withProperties(
                              lineColor("#2563EB"),
                              lineWidth(6f),
                              lineCap(Property.LINE_CAP_ROUND),
                              lineJoin(Property.LINE_JOIN_ROUND)
                          )
                      )
                      style.addLayer(
                          CircleLayer(CAMERA_LAYER, CAMERA_SOURCE).withProperties(
          """,
              """            // White casing makes the selected route visible over junctions and flyovers.
                      style.addLayer(
                          LineLayer(ROUTE_CASING_LAYER, ROUTE_SOURCE).withProperties(
                              lineColor("#FFFFFF"),
                              lineWidth(10f),
                              lineCap(Property.LINE_CAP_ROUND),
                              lineJoin(Property.LINE_JOIN_ROUND)
                          )
                      )
                      style.addLayer(
                          LineLayer(ROUTE_LAYER, ROUTE_SOURCE).withProperties(
                              lineColor("#005BFF"),
                              lineWidth(6f),
                              lineCap(Property.LINE_CAP_ROUND),
                              lineJoin(Property.LINE_JOIN_ROUND)
                          )
                      )
                      style.addLayer(
                          CircleLayer(TURN_LAYER, TURN_SOURCE).withProperties(
                              circleRadius(9f),
                              circleColor("#F97316"),
                              circleStrokeColor("#FFFFFF"),
                              circleStrokeWidth(3f)
                          )
                      )
                      style.addLayer(
                          CircleLayer(CAMERA_LAYER, CAMERA_SOURCE).withProperties(
          """,
              "route casing and turn marker layers",
          )
          replace_once(
              """                    currentRoute = route
                              currentStepIndex = route.steps.indexOfFirst { it.type != "depart" }.let { if (it >= 0) it else 0 }
                              warnedCameraIds.clear()
                              followGps = true
                              currentStyle?.getSourceAs<GeoJsonSource>(ROUTE_SOURCE)?.setGeoJson(route.geoJson)
          """,
              """                    currentRoute = route
                              currentStepIndex = route.steps.indexOfFirst { it.type != "depart" }.let { if (it >= 0) it else 0 }
                              navigationStarted = false
                              startNavigationButton.text = "MULA"
                              startNavigationButton.isEnabled = true
                              warnedCameraIds.clear()
                              followGps = true
                              currentStyle?.getSourceAs<GeoJsonSource>(ROUTE_SOURCE)?.setGeoJson(route.geoJson)
                              updateTurnMarker()
          """,
              "route ready and start button",
          )
          replace_once(
              '                    loadSpeedCameras(route.coordinates, route.distanceMeters)\n',
              '                    updateMetrics(currentLocation)\n                    loadSpeedCameras(route.coordinates, route.distanceMeters)\n',
              "initial metrics",
          )
          replace_once(
              '                    tts?.speak("Laluan ditemui. Jarak ${formatDistance(route.distanceMeters)}. ${route.steps.getOrNull(currentStepIndex)?.instruction ?: "Ikut garisan biru."}", TextToSpeech.QUEUE_FLUSH, null, "route_start")\n',
              '                    speakNavigation("Laluan ditemui. Jarak ${formatDistance(route.distanceMeters)}. Tekan Mula untuk memulakan panduan.", TextToSpeech.QUEUE_FLUSH, "route_ready")\n',
              "route-ready speech",
          )

          maneuver_pattern = r"    private fun describeManeuver\(type: String, modifier: String, road: String\): String \{.*?\n    \}\n"
          maneuver_replacement = """    private fun describeManeuver(type: String, modifier: String, road: String): String {
                  val side = modifier.lowercase(Locale.ROOT)
                  val action = when (type.lowercase(Locale.ROOT)) {
                      "depart" -> "Mulakan perjalanan"
                      "arrive" -> "Anda tiba di destinasi"
                      "turn", "end of road" -> when (side) {
                          "left" -> "Belok kiri"
                          "right" -> "Belok kanan"
                          "slight left" -> "Belok sedikit ke kiri"
                          "slight right" -> "Belok sedikit ke kanan"
                          "sharp left" -> "Belok tajam ke kiri"
                          "sharp right" -> "Belok tajam ke kanan"
                          "uturn", "u-turn" -> "Buat pusingan U"
                          else -> "Belok mengikut laluan biru"
                      }
                      "on ramp" -> when (side) {
                          "left", "slight left", "sharp left" -> "Ambil susur masuk kiri; ikut laluan biru untuk naik ke flyover jika ditunjukkan"
                          "right", "slight right", "sharp right" -> "Ambil susur masuk kanan; ikut laluan biru untuk naik ke flyover jika ditunjukkan"
                          else -> "Masuk ke jalan susur yang diserlahkan biru"
                      }
                      "off ramp" -> when (side) {
                          "left", "slight left", "sharp left" -> "Keluar melalui susur kiri yang diserlahkan biru"
                          "right", "slight right", "sharp right" -> "Keluar melalui susur kanan yang diserlahkan biru"
                          else -> "Keluar melalui jalan susur yang diserlahkan biru"
                      }
                      "fork" -> when (side) {
                          "left", "slight left", "sharp left" -> "Di percabangan, ikut jalan kiri yang berwarna biru"
                          "right", "slight right", "sharp right" -> "Di percabangan, ikut jalan kanan yang berwarna biru"
                          else -> "Di percabangan, ikut jalan yang berwarna biru"
                      }
                      "merge" -> when (side) {
                          "left", "slight left" -> "Masuk ke laluan utama dari kiri"
                          "right", "slight right" -> "Masuk ke laluan utama dari kanan"
                          else -> "Cantum ke laluan utama yang berwarna biru"
                      }
                      "roundabout", "rotary" -> "Masuk bulatan dan ikut laluan biru"
                      "roundabout turn" -> "Ikut bulatan mengikut laluan biru"
                      "exit roundabout" -> when (side) {
                          "left", "slight left" -> "Keluar bulatan ke kiri"
                          "right", "slight right" -> "Keluar bulatan ke kanan"
                          else -> "Keluar bulatan mengikut laluan biru"
                      }
                      "continue", "new name" -> "Teruskan mengikut laluan biru"
                      else -> "Ikut laluan biru dan jangan ambil jalan kelabu"
                  }
                  return if (road.isNotBlank() && type.lowercase(Locale.ROOT) !in setOf("depart", "arrive")) "$action ke $road" else action
              }
          """
          match = re.search(maneuver_pattern, source, re.S)
          if not match:
              raise SystemExit("Patch stopped: could not locate describeManeuver")
          source = source[:match.start()] + maneuver_replacement + source[match.end():]

          progress_pattern = r"    private fun updateNavigationProgress\(location: Location\) \{.*?\n    \}\n\n    private fun checkNearbySpeedCameras"
          progress_replacement = """    private fun startNavigation() {
                  val route = currentRoute
                  if (route == null) {
                      statusText.text = "Cari destinasi dahulu, kemudian tekan MULA."
                      return
                  }
                  navigationStarted = true
                  followGps = true
                  startNavigationButton.text = "AKTIF"
                  startNavigationButton.isEnabled = false
                  currentLocation?.let {
                      updateNavigationProgress(it)
                      focusOnLocation(it, nextCameraZoom(it))
                  }
                  val instruction = route.steps.getOrNull(currentStepIndex)?.instruction ?: "Ikut laluan biru"
                  speakNavigation("Navigasi bermula. $instruction", TextToSpeech.QUEUE_FLUSH, "navigation_start")
              }

              private fun nextCameraZoom(location: Location): Double {
                  val step = currentRoute?.steps?.getOrNull(currentStepIndex) ?: return 16.5
                  val distance = distanceMeters(location.latitude, location.longitude, step.latitude, step.longitude)
                  return if (navigationStarted && distance <= 100.0) 18.5 else 16.5
              }

              private fun updateTurnMarker() {
                  val step = currentRoute?.steps?.getOrNull(currentStepIndex)
                  val json = if (step == null) {
                      EMPTY_FEATURE_COLLECTION
                  } else {
                      JSONObject()
                          .put("type", "FeatureCollection")
                          .put("features", JSONArray().put(JSONObject()
                              .put("type", "Feature")
                              .put("geometry", JSONObject().put("type", "Point")
                                  .put("coordinates", JSONArray().put(step.longitude).put(step.latitude)))
                              .put("properties", JSONObject())))
                          .toString()
                  }
                  currentStyle?.getSourceAs<GeoJsonSource>(TURN_SOURCE)?.setGeoJson(json)
              }

              private fun updateMetrics(location: Location?) {
                  val speedKmh = if (location != null && location.hasSpeed()) (location.speed * 3.6f).roundToInt() else 0
                  val route = currentRoute
                  if (route == null) {
                      metricsText.text = "Kelajuan: $speedKmh km/j  •  Ke destinasi: --  •  Baki: --"
                      return
                  }
                  val step = route.steps.getOrNull(currentStepIndex)
                  val toTurn = if (location != null && step != null) {
                      distanceMeters(location.latitude, location.longitude, step.latitude, step.longitude)
                  } else 0.0
                  val remainingDistance = if (step == null) 0.0 else
                      (toTurn + route.steps.drop(currentStepIndex + 1).sumOf { it.distanceMeters }).coerceAtMost(route.distanceMeters)
                  val remainingSeconds = if (route.distanceMeters > 0.0) route.durationSeconds * (remainingDistance / route.distanceMeters) else 0.0
                  metricsText.text = "Kelajuan: $speedKmh km/j  •  Ke destinasi: ${formatDistance(remainingDistance)}  •  Baki: ${formatDuration(remainingSeconds)}"
              }

              private fun applyTtsLanguage() {
                  val engine = tts ?: return
                  val preferred = if (voiceLanguage == "english") Locale.US else Locale("ms", "MY")
                  val result = engine.setLanguage(preferred)
                  if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                      engine.setLanguage(if (voiceLanguage == "english") Locale.ENGLISH else Locale("ms"))
                  }
              }

              private fun speakNavigation(message: String, queueMode: Int, utteranceId: String) {
                  val spoken = if (voiceLanguage == "english") localizeEnglish(message) else localizeKelantan(message)
                  tts?.speak(spoken, queueMode, null, utteranceId)
              }

              private fun localizeEnglish(message: String): String {
                  var result = message
                  val replacements = listOf(
                      "Ambil susur masuk kiri; ikut laluan biru untuk naik ke flyover jika ditunjukkan" to "Take the left ramp onto the flyover if shown by the blue route",
                      "Ambil susur masuk kanan; ikut laluan biru untuk naik ke flyover jika ditunjukkan" to "Take the right ramp onto the flyover if shown by the blue route",
                      "Keluar melalui jalan susur yang diserlahkan biru" to "Take the blue exit ramp",
                      "Masuk ke jalan susur yang diserlahkan biru" to "Take the blue entrance ramp",
                      "Di percabangan, ikut jalan kiri" to "At the fork, take the left road",
                      "Di percabangan, ikut jalan kanan" to "At the fork, take the right road",
                      "Belok sedikit ke kiri" to "Bear slightly left",
                      "Belok sedikit ke kanan" to "Bear slightly right",
                      "Belok tajam ke kiri" to "Turn sharply left",
                      "Belok tajam ke kanan" to "Turn sharply right",
                      "Anda tiba di destinasi" to "You have arrived at your destination",
                      "Mulakan perjalanan" to "Start your journey",
                      "Laluan ditemui" to "Route found",
                      "Navigasi bermula" to "Navigation started",
                      "Belok kiri" to "Turn left",
                      "Belok kanan" to "Turn right",
                      "Buat pusingan U" to "Make a U-turn",
                      "Teruskan mengikut laluan biru" to "Continue along the blue route",
                      "Ikut laluan biru" to "Follow the blue route",
                      "Jarak" to "Distance",
                      " dalam " to " in ",
                      " ke " to " toward ",
                      " km" to " kilometers",
                      " m" to " meters",
                      " min" to " minutes",
                      " jam " to " hours "
                  )
                  for ((from, to) in replacements) result = result.replace(from, to, ignoreCase = false)
                  return result
              }

              private fun localizeKelantan(message: String): String {
                  var result = message
                  val replacements = listOf(
                      "Ambil susur masuk kiri; ikut laluan biru untuk naik ke flyover jika ditunjukkan" to "Masuk susur kiri ikut jalan biru kalau kena naik flyover",
                      "Ambil susur masuk kanan; ikut laluan biru untuk naik ke flyover jika ditunjukkan" to "Masuk susur kanan ikut jalan biru kalau kena naik flyover",
                      "Keluar melalui susur kiri" to "Keluar ikut susur kiri",
                      "Keluar melalui susur kanan" to "Keluar ikut susur kanan",
                      "Di percabangan, ikut jalan kiri" to "Di simpang pecah, ikut jalan kiri",
                      "Di percabangan, ikut jalan kanan" to "Di simpang pecah, ikut jalan kanan",
                      "Belok sedikit ke kiri" to "Ambik kiri sikit",
                      "Belok sedikit ke kanan" to "Ambik kanan sikit",
                      "Belok tajam ke kiri" to "Ambik kiri tajam",
                      "Belok tajam ke kanan" to "Ambik kanan tajam",
                      "Anda tiba di destinasi" to "Demo doh sampai ke destinasi",
                      "Mulakan perjalanan" to "Mulo perjalanan",
                      "Navigasi bermula" to "Panduan jalan doh bermula",
                      "Belok kiri" to "Ambik simpang kiri",
                      "Belok kanan" to "Ambik simpang kanan",
                      "Buat pusingan U" to "Pusing balik",
                      "Teruskan mengikut laluan biru" to "Teruih ikut jalan biru",
                      "Ikut laluan biru" to "Ikut jalan biru",
                      " dalam " to " lagi dalam "
                  )
                  for ((from, to) in replacements) result = result.replace(from, to, ignoreCase = false)
                  return result
              }

              private fun updateNavigationProgress(location: Location) {
                  updateMetrics(location)
                  val route = currentRoute ?: return
                  if (route.steps.isEmpty() || currentStepIndex !in route.steps.indices) return
                  var step = route.steps[currentStepIndex]
                  var distance = distanceMeters(location.latitude, location.longitude, step.latitude, step.longitude)
                  if (navigationStarted && distance < 40.0 && currentStepIndex < route.steps.lastIndex) {
                      currentStepIndex += 1
                      step = route.steps[currentStepIndex]
                      distance = distanceMeters(location.latitude, location.longitude, step.latitude, step.longitude)
                      speakNavigation(step.instruction, TextToSpeech.QUEUE_ADD, "turn_$currentStepIndex")
                  }
                  updateTurnMarker()
                  if (!navigationStarted) return
                  nextTurnText.text = when {
                      step.type == "arrive" -> step.instruction
                      distance <= 100.0 -> "${step.instruction} — ${formatDistance(distance)}"
                      else -> "${step.instruction} dalam ${formatDistance(distance)}"
                  }
                  updateMetrics(location)
              }

              private fun checkNearbySpeedCameras"""
          match = re.search(progress_pattern, source, re.S)
          if not match:
              raise SystemExit("Patch stopped: could not locate updateNavigationProgress")
          source = source[:match.start()] + progress_replacement + source[match.end():]

          replace_once(
              '        tts?.speak("Amaran. Kamera kelajuan dalam kira-kira ${distance.roundToInt()} meter. Kekalkan had laju.", TextToSpeech.QUEUE_ADD, null, "camera_${nearby.first.id}")\n',
              '        speakNavigation("Amaran. Kamera kelajuan dalam kira-kira ${distance.roundToInt()} meter. Kekalkan had laju.", TextToSpeech.QUEUE_ADD, "camera_${nearby.first.id}")\n',
              "camera alert speech",
          )
          replace_once(
              """    override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("ms", "MY"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.setLanguage(Locale("en", "US"))
                      }
                  }
              }
          """,
              """    override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) applyTtsLanguage()
              }
          """,
              "TTS language initialization",
          )
          source_path.write_text(source, encoding="utf-8")

          drawable_dir = Path("app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          (drawable_dir / "ic_qm_navigation.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#0F172A" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#FFFFFF" android:fillType="evenOdd"
                  android:pathData="M24,5 A19,19 0,1 0,24 43 A19,19 0,1 0,24 5 M24,12 A12,12 0,1 1,24 36 A12,12 0,1 1,24 12" />
              <path android:fillColor="#FFFFFF" android:pathData="M29,29 L44,43 L39,48 L25,34 Z" />
              <path android:fillColor="#75D38A" android:pathData="M17,18 L23,18 L27,24 L31,18 L37,18 L37,32 L32,32 L32,25 L27,31 L22,25 L22,32 L17,32 Z" />
          </vector>
          """, encoding="utf-8")

          manifest_path = Path("app/src/main/AndroidManifest.xml")
          android_ns = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          tree = ET.parse(manifest_path)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("Patch stopped: AndroidManifest.xml has no application element")
          application.set(android_ns + "icon", "@drawable/ic_qm_navigation")
          application.set(android_ns + "roundIcon", "@drawable/ic_qm_navigation")
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          print("Enhanced route colors, junction marker, 100 m zoom, Start button, live metrics, English/Kelantan Malay speech, and Q+M launcher icon.")
          PY

      - name: Add POIs and online map refresh
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: |
          python3 - <<'PY'
          """Add nearby OSM POIs and server-validated map refresh after enhanced-6 patches."""
          from pathlib import Path
          
          path = Path('app/src/main/java/com/nav3dmalaysia/MainActivity.kt')
          source = path.read_text()
          
          def replace(old, new):
              global source
              if source.count(old) != 1:
                  raise SystemExit(f'POI patch: expected one match: {old[:90]!r}')
              source = source.replace(old, new, 1)
          
          replace('import android.Manifest\n', 'import android.Manifest\nimport androidx.appcompat.app.AlertDialog\nimport org.maplibre.android.offline.OfflineManager\nimport android.os.SystemClock\n')
          replace('    private var map: MapLibreMap? = null', '''    private lateinit var poiCategorySpinner: Spinner
              private lateinit var poiStatusText: TextView
              private lateinit var poiSearchButton: Button
              private lateinit var mapRefreshButton: Button
              private var poiPoints: List<Poi> = emptyList()
              private var poiRequestId = 0
              private var poiLoading = false
              private var poiRefreshPending = false
              private var poiLastAttempt = 0L
              private var poiSearchCenter: GeoPoint? = null
              private var mapRefreshing = false
              private val poiCategories = listOf(
                  "Semua POI", "Stesen minyak", "Restoran / kafe", "Hospital / klinik",
                  "Masjid / surau", "ATM / bank", "Parkir", "Kedai / pasar raya", "Tarikan pelancongan"
              )
              private var map: MapLibreMap? = null''')
          replace('        mapView = MapView(this)', '''        val poiRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), 0, dp(8), dp(3))
                  }
                  poiCategorySpinner = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, poiCategories)
                  }
                  poiRow.addView(poiCategorySpinner, LinearLayout.LayoutParams(0, dp(44), 1f))
                  poiSearchButton = makeButton("CARI POI")
                  poiSearchButton.setOnClickListener { loadNearbyPois(showList = true) }
                  poiRow.addView(poiSearchButton, LinearLayout.LayoutParams(dp(90), dp(44)))
                  mapRefreshButton = makeButton("KEMAS KINI")
                  mapRefreshButton.setOnClickListener { refreshOnlineMap() }
                  poiRow.addView(mapRefreshButton, LinearLayout.LayoutParams(dp(96), dp(44)))
                  root.addView(poiRow, LinearLayout.LayoutParams(-1, -2))
                  poiStatusText = TextView(this).apply {
                      text = "POI hijau • Radius 3 km dari tengah peta • Ketik penanda untuk navigasi"
                      textSize = 11f
                      setTextColor(Color.rgb(51, 65, 85))
                      setPadding(dp(12), 0, dp(12), dp(4))
                  }
                  root.addView(poiStatusText, LinearLayout.LayoutParams(-1, -2))
          
                  mapView = MapView(this)''')
          replace('                readyMap.uiSettings.isCompassEnabled = true', '''                readyMap.uiSettings.isCompassEnabled = true
                          readyMap.addOnMapClickListener { coordinate ->
                              val projection = readyMap.projection
                              val tap = projection.toScreenLocation(coordinate)
                              val nearest = poiPoints.minByOrNull {
                                  val pixel = projection.toScreenLocation(LatLng(it.point.latitude, it.point.longitude))
                                  val dx = pixel.x - tap.x
                                  val dy = pixel.y - tap.y
                                  dx * dx + dy * dy
                              }
                              if (nearest == null) false else {
                                  val pixel = projection.toScreenLocation(LatLng(nearest.point.latitude, nearest.point.longitude))
                                  val dx = pixel.x - tap.x
                                  val dy = pixel.y - tap.y
                                  if (dx * dx + dy * dy <= dp(24) * dp(24)) {
                                      showPoiDetails(nearest)
                                      true
                                  } else false
                              }
                          }
                          readyMap.addOnCameraIdleListener {
                              val previous = poiSearchCenter
                              val center = readyMap.cameraPosition.target
                              if (!mapRefreshing && !poiLoading && previous != null && center != null &&
                                  SystemClock.elapsedRealtime() - poiLastAttempt > 60000L &&
                                  distanceMeters(previous.latitude, previous.longitude, center.latitude, center.longitude) > 1500.0) {
                                  loadNearbyPois()
                              }
                          }''')
          # Begin querying after the initial camera target has been assigned.
          replace('                    } catch (error: Throwable) {\n                        android.util.Log.e("QM_NAVIGASI", "Map style setup failed", error)', '''                        loadNearbyPois()
                              } catch (error: Throwable) {
                                  android.util.Log.e("QM_NAVIGASI", "Map style setup failed", error)''')
          replace('            style.addSource(GeoJsonSource(USER_SOURCE, EMPTY_FEATURE_COLLECTION))', '''            style.addSource(GeoJsonSource(USER_SOURCE, EMPTY_FEATURE_COLLECTION))
                      style.addSource(GeoJsonSource("nav-poi-source", EMPTY_FEATURE_COLLECTION))
                      style.addLayer(CircleLayer("nav-poi-layer", "nav-poi-source").withProperties(
                          circleRadius(7f), circleColor("#15803D"),
                          circleStrokeColor("#FFFFFF"), circleStrokeWidth(2f)
                      ))''')
          replace('            refreshCameraLayer()\n        } catch (error: Exception)', '''            refreshCameraLayer()
                      refreshPoiLayer()
                      currentRoute?.let { style.getSourceAs<GeoJsonSource>(ROUTE_SOURCE)?.setGeoJson(it.geoJson) }
                      updateTurnMarker()
                  } catch (error: Exception)''')
          replace('    private fun findRoute() {', '    private fun findRoute(poiTarget: GeoPoint? = null) {')
          replace('                val target = geocodeDestination(query)', '                val target = poiTarget ?: geocodeDestination(query)')
          
          methods = r'''
              private data class Poi(val id: String, val name: String, val category: String, val point: GeoPoint)
          
              private fun poiSelector(category: Int): String = when (category) {
                  1 -> "[\"amenity\"=\"fuel\"]"
                  2 -> "[\"amenity\"~\"^(restaurant|cafe|fast_food|food_court)$\"]"
                  3 -> "[\"amenity\"~\"^(hospital|clinic|pharmacy)$\"]"
                  4 -> "[\"amenity\"=\"place_of_worship\"][\"religion\"=\"muslim\"]"
                  5 -> "[\"amenity\"~\"^(atm|bank)$\"]"
                  6 -> "[\"amenity\"=\"parking\"]"
                  7 -> "[\"shop\"~\"^(supermarket|convenience|mall)$\"]"
                  8 -> "[\"tourism\"~\"^(attraction|museum|viewpoint)$\"]"
                  else -> "[\"amenity\"~\"^(fuel|restaurant|cafe|fast_food|hospital|clinic|pharmacy|place_of_worship|atm|bank|parking)$\"]"
              }
          
              private fun refreshPoiLayer() {
                  val features = JSONArray()
                  for (poi in poiPoints) {
                      features.put(JSONObject().put("type", "Feature")
                          .put("properties", JSONObject().put("id", poi.id).put("name", poi.name))
                          .put("geometry", JSONObject().put("type", "Point")
                              .put("coordinates", JSONArray().put(poi.point.longitude).put(poi.point.latitude))))
                  }
                  currentStyle?.getSourceAs<GeoJsonSource>("nav-poi-source")?.setGeoJson(
                      JSONObject().put("type", "FeatureCollection").put("features", features).toString()
                  )
              }
          
              private fun loadNearbyPois(showList: Boolean = false, force: Boolean = false) {
                  val target = map?.cameraPosition?.target ?: return
                  if (isFinishing || isDestroyed) return
                  val now = SystemClock.elapsedRealtime()
                  if (poiLoading && force) {
                      poiRefreshPending = true
                      return
                  }
                  if (poiLoading || (!force && poiLastAttempt != 0L && now - poiLastAttempt < 5000L)) {
                      if (showList) Toast.makeText(this, "Tunggu sebentar sebelum carian POI seterusnya.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val center = GeoPoint(target.latitude, target.longitude)
                  val category = poiCategorySpinner.selectedItemPosition.coerceAtLeast(0)
                  val requestId = ++poiRequestId
                  poiLoading = true
                  poiSearchButton.isEnabled = false
                  poiLastAttempt = now
                  poiStatusText.text = "Mencari ${poiCategories[category]} dalam 3 km dari tengah peta..."
                  networkExecutor.execute {
                      try {
                          val selector = poiSelector(category)
                          val around = "(around:3000,${center.latitude},${center.longitude})"
                          val extra = if (category == 0)
                              "nwr$around[\"shop\"~\"^(supermarket|convenience|mall)$\"];nwr$around[\"tourism\"~\"^(attraction|museum|viewpoint)$\"];" else ""
                          // Include ways and relations; their centres are used as map/search points.
                          val query = "[out:json][timeout:20];(nwr$around$selector;$extra);out center tags;"
                          val connection = (URL("https://overpass-api.de/api/interpreter").openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              doOutput = true
                              useCaches = false
                              connectTimeout = 15000
                              readTimeout = 25000
                              setRequestProperty("User-Agent", "QM-NAVIGASI/1.1 Android POI")
                              setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8")
                              setRequestProperty("Cache-Control", "no-cache")
                          }
                          val result = try {
                              connection.outputStream.use { it.write(("data=" + URLEncoder.encode(query, "UTF-8")).toByteArray(Charsets.UTF_8)) }
                              if (connection.responseCode != 200) throw IllegalStateException("Pelayan POI sibuk (${connection.responseCode}). Cuba lagi kemudian.")
                              JSONObject(connection.inputStream.bufferedReader().use { it.readText() })
                          } finally { connection.disconnect() }
                          if (result.has("remark")) throw IllegalStateException("Carian POI tidak lengkap. Cuba lagi kemudian.")
                          val elements = result.getJSONArray("elements")
                          val found = LinkedHashMap<String, Poi>()
                          for (index in 0 until elements.length()) {
                              val item = elements.getJSONObject(index)
                              val position = item.optJSONObject("center") ?: item
                              val lat = position.optDouble("lat", Double.NaN)
                              val lon = position.optDouble("lon", Double.NaN)
                              if (!lat.isFinite() || !lon.isFinite() || lat !in -90.0..90.0 || lon !in -180.0..180.0) continue
                              val tags = item.optJSONObject("tags") ?: continue
                              val kind = tags.optString("amenity").ifBlank { tags.optString("shop").ifBlank { tags.optString("tourism", "POI") } }
                              val name = tags.optString("name:ms").ifBlank { tags.optString("name").ifBlank { tags.optString("brand").ifBlank { kind.replace('_', ' ') } } }
                              val id = "${item.getString("type")}/${item.getLong("id")}"
                              found[id] = Poi(id, name, kind.replace('_', ' '), GeoPoint(lat, lon))
                          }
                          val nearest = found.values.filter {
                              distanceMeters(center.latitude, center.longitude, it.point.latitude, it.point.longitude) <= 3000.0
                          }.sortedBy { distanceMeters(center.latitude, center.longitude, it.point.latitude, it.point.longitude) }.take(200)
                          val dataTime = result.optJSONObject("osm3s")?.optString("timestamp_osm_base").orEmpty()
                          runOnUiThread {
                              if (requestId != poiRequestId || isFinishing || isDestroyed) return@runOnUiThread
                              poiLoading = false
                              poiSearchButton.isEnabled = true
                              poiPoints = nearest
                              poiSearchCenter = center
                              refreshPoiLayer()
                              val fetched = java.text.SimpleDateFormat("HH:mm", Locale("ms", "MY")).format(java.util.Date())
                              poiStatusText.text = "${nearest.size} POI • ${poiCategories[category]} • Disemak $fetched" +
                                  (if (dataTime.isNotBlank()) "\nData OSM: $dataTime" else "") +
                                  "\nHijau = POI • Jarak garis lurus dari tengah peta • Maks. 200 terdekat"
                              if (poiRefreshPending) {
                                  poiRefreshPending = false
                                  loadNearbyPois(force = true)
                              } else if (showList) showPoiList(center)
                          }
                      } catch (error: Exception) {
                          runOnUiThread {
                              if (requestId != poiRequestId || isFinishing || isDestroyed) return@runOnUiThread
                              poiLoading = false
                              poiSearchButton.isEnabled = true
                              poiStatusText.text = "POI gagal dikemas kini: ${error.localizedMessage ?: "Semak internet"}. Penanda terdahulu dikekalkan."
                              if (poiRefreshPending) {
                                  poiRefreshPending = false
                                  loadNearbyPois(force = true)
                              }
                          }
                      }
                  }
              }
          
              private fun showPoiList(center: GeoPoint) {
                  if (poiPoints.isEmpty()) {
                      AlertDialog.Builder(this).setTitle("POI berdekatan").setMessage("Tiada POI kategori ini ditemui dalam 3 km. Gerakkan peta atau pilih kategori lain.")
                          .setPositiveButton("OK", null).show()
                      return
                  }
                  val snapshot = poiPoints.toList()
                  val labels = snapshot.map { "${it.name}\n${it.category} • ${formatDistance(distanceMeters(center.latitude, center.longitude, it.point.latitude, it.point.longitude))}" }.toTypedArray()
                  AlertDialog.Builder(this).setTitle("POI — jarak garis lurus")
                      .setItems(labels) { _, index -> showPoiDetails(snapshot[index]) }
                      .setNegativeButton("Tutup", null).show()
              }
          
              private fun showPoiDetails(poi: Poi) {
                  AlertDialog.Builder(this).setTitle(poi.name)
                      .setMessage("${poi.category}\n${poi.point.latitude}, ${poi.point.longitude}\nSumber: © OpenStreetMap contributors. Semak akses masuk dan waktu operasi di lokasi.")
                      .setPositiveButton("NAVIGASI") { _, _ ->
                          destinationInput.setText(poi.name)
                          findRoute(poi.point)
                      }
                      .setNeutralButton("LIHAT PETA") { _, _ ->
                          followGps = false
                          map?.animateCamera(CameraUpdateFactory.newLatLngZoom(LatLng(poi.point.latitude, poi.point.longitude), 17.0))
                      }
                      .setNegativeButton("Tutup", null).show()
              }
          
              private fun refreshOnlineMap() {
                  val readyMap = map ?: return
                  if (mapRefreshing || isFinishing || isDestroyed) return
                  mapRefreshing = true
                  mapRefreshButton.isEnabled = false
                  poiStatusText.text = "Menyemak semula cache peta dengan pelayan..."
                  val timeout = Runnable {
                      if (!isFinishing && !isDestroyed && mapRefreshing) {
                          mapRefreshing = false
                          mapRefreshButton.isEnabled = true
                          poiStatusText.text = "Peta belum selesai dimuatkan. Semak internet dan cuba KEMAS KINI semula."
                      }
                  }
                  mapRefreshButton.postDelayed(timeout, 30000L)
                  OfflineManager.getInstance(this).invalidateAmbientCache(object : OfflineManager.FileSourceCallback {
                      override fun onSuccess() {
                          if (isFinishing || isDestroyed) return
                          currentStyle = null
                          readyMap.setStyle(Style.Builder().fromUri(MAP_STYLE_URL)) { style ->
                              if (isFinishing || isDestroyed) return@setStyle
                              currentStyle = style
                              installMapLayers(style)
                              mapRefreshing = false
                              mapRefreshButton.isEnabled = true
                              mapRefreshButton.removeCallbacks(timeout)
                              poiStatusText.text = "Peta dimuat semula mengikut versi pembekal. Data POI sedang disemak."
                              loadNearbyPois(force = true)
                          }
                      }
                      override fun onError(message: String) {
                          if (isFinishing || isDestroyed) return
                          mapRefreshing = false
                          mapRefreshButton.isEnabled = true
                          mapRefreshButton.removeCallbacks(timeout)
                          poiStatusText.text = "Peta gagal disemak: $message. Cuba lagi apabila internet tersedia."
                      }
                  })
              }
          
          '''
          replace('    private fun makeButton(label: String)', methods + '    private fun makeButton(label: String)')
          replace('    override fun onDestroy() {', '    override fun onDestroy() {\n        poiRequestId += 1')
          path.write_text(source)
          gradle = Path('app/build.gradle.kts')
          config = gradle.read_text().replace('versionCode = 1', 'versionCode = 2').replace('versionName = "1.0.0"', 'versionName = "1.1.0"')
          gradle.write_text(config)
          print('POI search, direct routing and cache-revalidated online map refresh applied.')
          PY

