                  root.addView(controls, LinearLayout.LayoutParams(-1, -2))
          """,
              """        startNavigationButton = makeButton("MULA")
                  startNavigationButton.isEnabled = false
                  startNavigationButton.setOnClickListener { startNavigation() }
                  listOf(gpsButton, threeDButton, cameraButton, startNavigationButton).forEachIndexed { index, button ->
                      val weight = if (index == 2) 1.2f else 1f
                      val params = LinearLayout.LayoutParams(0, dp(42), weight)
                      if (index > 0) params.marginStart = dp(4)
                      controls.addView(button, params)
                  }
                  root.addView(controls, LinearLayout.LayoutParams(-1, -2))

                  val voiceRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), 0, dp(12), dp(5))
                  }
                  val voiceLabel = TextView(this).apply {
                      text = "SUARA:"
                      textSize = 12f
                      setTextColor(Color.rgb(51, 65, 85))
                  }
                  voiceRow.addView(voiceLabel, LinearLayout.LayoutParams(-2, dp(40)))
                  voiceLanguageSpinner = Spinner(this)
                  val voiceAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_item, listOf("Melayu Kelantan", "English"))
                  voiceAdapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  voiceLanguageSpinner.adapter = voiceAdapter
                  voiceLanguageSpinner.setSelection(0)
                  voiceLanguageSpinner.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: android.widget.AdapterView<*>?, view: android.view.View?, position: Int, id: Long) {
                          voiceLanguage = if (position == 1) "english" else "kelantan"
                          applyTtsLanguage()
