                  raise SystemExit(f"Patch stopped: expected one match for {label}, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              "import android.widget.Button\nimport android.widget.EditText\n",
              "import android.widget.ArrayAdapter\nimport android.widget.Button\nimport android.widget.EditText\nimport android.widget.Spinner\n",
              "widget imports",
          )
          replace_once(
              '        private const val ROUTE_LAYER = "nav-route-layer"\n        private const val CAMERA_SOURCE = "nav-camera-source"\n',
              '        private const val ROUTE_LAYER = "nav-route-layer"\n        private const val ROUTE_CASING_LAYER = "nav-route-casing-layer"\n        private const val TURN_SOURCE = "nav-turn-source"\n        private const val TURN_LAYER = "nav-turn-layer"\n        private const val CAMERA_SOURCE = "nav-camera-source"\n',
