              raise SystemExit("TomTom style patch: navigation camera builder not found")
          bearing_line = re.search(r'\n(\s*)\.bearing\(bearing\)', match.group(1))
          indent = bearing_line.group(1) if bearing_line else "                            "
          source = source[:match.end()] + "\n" + indent + ".tilt(if (navigationStarted) 55.0 else 0.0)" + source[match.end():]

          # Keep the next-turn instruction visible as a navigation banner.
          hidden_turn = "nextTurnText.visibility = android.view.View.GONE"
          if source.count(hidden_turn) != 1:
              raise SystemExit("TomTom style patch: next-turn visibility anchor not found uniquely")
          source = source.replace(hidden_turn, "nextTurnText.visibility = android.view.View.VISIBLE", 1)

          # Upgrade the selected route to a stronger blue with a white casing.
          if source.count('lineColor("#005BFF")') != 1:
              raise SystemExit("TomTom style patch: selected route color anchor not found uniquely")
          source = source.replace('lineColor("#005BFF")', 'lineColor("#1677FF")', 1)
          source, casing_count = re.subn(r'(LineLayer\(ROUTE_CASING_LAYER, ROUTE_SOURCE\).*?lineWidth\()10f(\))', r'\g<1>12f\2', source, count=1, flags=re.S)
          source, route_count = re.subn(r'(LineLayer\(ROUTE_LAYER, ROUTE_SOURCE\).*?lineWidth\()6f(\))', r'\g<1>8f\2', source, count=1, flags=re.S)
          if casing_count != 1 or route_count != 1:
              raise SystemExit("TomTom style patch: route line widths could not be updated")

          # Use a compact dark navigation panel, with high-contrast turn, speed and traffic text.
          panel_pattern = r'(?m)^(\s*)bottomPanel\.addView\(trafficStatus, LinearLayout\.LayoutParams\(-1, -2\)\)$'
          panel_match = re.search(panel_pattern, source)
          if not panel_match:
              raise SystemExit("TomTom style patch: bottom navigation panel anchor not found")
          indent = panel_match.group(1)
          panel_style = "\n".join([
              indent + 'bottomPanel.background = android.graphics.drawable.GradientDrawable().apply {',
              indent + '    setColor(Color.rgb(15, 23, 42))',
              indent + '    cornerRadius = dp(18).toFloat()',
              indent + '}',
              indent + 'bottomPanel.setPadding(dp(14), dp(10), dp(14), dp(10))',
              indent + 'bottomPanel.elevation = dp(8).toFloat()',
              indent + 'statusText.setTextColor(Color.rgb(203, 213, 225))',
              indent + 'metricsText.setTextColor(Color.rgb(226, 232, 240))',
              indent + 'metricsText.textSize = 14f',
              indent + 'nextTurnText.visibility = android.view.View.VISIBLE',
              indent + 'nextTurnText.setTextColor(Color.WHITE)',
              indent + 'nextTurnText.textSize = 18f',
              indent + 'nextTurnText.setTypeface(null, android.graphics.Typeface.BOLD)',
              indent + 'trafficStatus.setTextColor(Color.rgb(148, 163, 184))',
              indent + 'routeLegendText.visibility = android.view.View.GONE',
          ])
          insert_at = panel_match.end()
          source = source[:insert_at] + "\n" + panel_style + source[insert_at:]

          path.write_text(source, encoding="utf-8")
          print("TomTom-style navigation display applied: 3D follow camera, stronger blue route, visible turn banner, dark HUD.")
          PY
      - name: Switch base map to dark style
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/nav3dmalaysia/MainActivity.kt")
          source = path.read_text(encoding="utf-8")
          old = "https://tiles.openfreemap.org/styles/liberty"
          new = "https://tiles.openfreemap.org/styles/dark"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected one base map style URL, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Base map style switched to OpenFreeMap Dark.")
          PY
      - name: Build APK
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QM-NAVIGASI-V2-SMART-OFFLINE-APK
          path: buildsrc/QM-NAVIGASI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

