          methods = '    private data class SearchPlace(val name: String, val address: String, val point: GeoPoint)\n    private lateinit var searchResults: android.widget.ListView\n    private lateinit var searchHint: TextView\n    private lateinit var trafficStatus: TextView\n    private lateinit var modeButton: Button\n    private val uiHandler = android.os.Handler(Looper.getMainLooper())\n    private val searchExecutor = Executors.newSingleThreadExecutor()\n    private var searchTask: Runnable? = null\n    private var searchGeneration = 0\n    private var searchInFlight = false\n    private var searchPending = false\n    private var suppressSearch = false\n    private var searchLastSent = 0L\n    private var searchPlaces: List<SearchPlace> = emptyList()\n    private var tapTone: android.media.ToneGenerator? = null\n    @Volatile private var offlineMode = false\n    @Volatile private var trafficApiKey = ""\n    private var trafficBusy = false\n    private var trafficLastCheck = 0L\n    private var trafficLastAlert = 0L\n    private var trafficDialog: AlertDialog? = null\n    @Volatile private var routeRequestId = 0\n    private var visibleActivity = false\n    private val trafficTimer = object : Runnable {\n        override fun run() {\n            if (!visibleActivity || isFinishing || isDestroyed) return\n            currentLocation?.let { checkLiveTraffic(it) }\n            uiHandler.postDelayed(this, 90000L)\n        }\n    }\n    private var activeDownload: org.maplibre.android.offline.OfflineRegion? = null\n\n    private fun tapFeedback() {\n        try {\n            if (tapTone == null) tapTone = android.media.ToneGenerator(android.media.AudioManager.STREAM_SYSTEM, 45)\n            tapTone?.startTone(android.media.ToneGenerator.TONE_PROP_BEEP, 65)\n        } catch (_: RuntimeException) { /* Sound follows device volume and audio availability. */ }\n    }\n\n    private fun showPoiArea() {\n        val center = map?.cameraPosition?.target ?: return\n        val lat = 3000.0 / 111320.0\n        val lon = lat / kotlin.math.cos(Math.toRadians(center.latitude)).coerceAtLeast(0.1)\n        val bounds = org.maplibre.android.geometry.LatLngBounds.from(center.latitude + lat, center.longitude + lon, center.latitude - lat, center.longitude - lon)\n        followGps = false\n        map?.animateCamera(CameraUpdateFactory.newLatLngBounds(bounds, dp(20)))\n    }\n\n    private fun setupDestinationSearch(root: LinearLayout) {\n        searchHint = TextView(this).apply {\n            textSize = 11f\n            setTextColor(Color.rgb(51, 65, 85))\n            setPadding(dp(12), 0, dp(12), 0)\n            visibility = android.view.View.GONE\n        }\n        searchResults = android.widget.ListView(this).apply {\n            setBackgroundColor(Color.WHITE)\n            visibility = android.view.View.GONE\n        }\n        root.addView(searchHint, LinearLayout.LayoutParams(-1, -2))\n        root.addView(searchResults, LinearLayout.LayoutParams(-1, dp(160)))\n        searchResults.setOnItemClickListener { _, _, position, _ ->\n            val place = searchPlaces.getOrNull(position) ?: return@setOnItemClickListener\n            tapFeedback()\n            selectSearchPlace(place)\n        }\n        destinationInput.hint = "Taip tempat (cth. Kuala...)"\n        destinationInput.addTextChangedListener(object : android.text.TextWatcher {\n            override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}\n            override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {\n                if (suppressSearch) return\n                scheduleDestinationSearch()\n            }\n            override fun afterTextChanged(s: android.text.Editable?) {}\n        })\n    }\n\n    private fun scheduleDestinationSearch(immediate: Boolean = false) {\n        searchGeneration += 1\n        searchTask?.let { uiHandler.removeCallbacks(it) }\n        searchPlaces = emptyList()\n        searchResults.visibility = android.view.View.GONE\n        val query = destinationInput.text.toString().trim()\n        if (query.length < 2) {\n            searchHint.text = "Taip sekurang-kurangnya 2 huruf."\n            searchHint.visibility = if (immediate) android.view.View.VISIBLE else android.view.View.GONE\n            return\n        }\n        searchHint.text = "Mencari padanan untuk ‘$query’..."\n        searchHint.visibility = android.view.View.VISIBLE\n        val task = Runnable { runDestinationSearch() }\n        searchTask = task\n        val cooldown = (1200L - (SystemClock.elapsedRealtime() - searchLastSent)).coerceAtLeast(0L)\n        uiHandler.postDelayed(task, if (immediate) cooldown else maxOf(700L, cooldown))\n    }\n\n    private fun runDestinationSearch() {\n        if (isFinishing || isDestroyed) return\n        if (searchInFlight) { searchPending = true; return }\n        val query = destinationInput.text.toString().trim()\n        if (query.length < 2) return\n        val generation = searchGeneration\n        val local = poiPoints.map { SearchPlace(it.name, it.category, it.point) }\n            .filter { NavigationRules.searchRank(it.name, it.address, query) < 3 }\n        if (offlineMode) { publishSearchResults(query, local); return }\n        searchInFlight = true\n        searchLastSent = SystemClock.elapsedRealtime()\n        searchExecutor.execute {\n            var error: String? = null\n            val remote = try {\n                val json = fetchJson("https://photon.komoot.io/api/?q=${URLEncoder.encode(query, "UTF-8")}&limit=50&countrycode=MY")\n                val features = json.getJSONArray("features")\n                (0 until features.length()).mapNotNull { index ->\n                    val item = features.getJSONObject(index)\n                    val props = item.getJSONObject("properties")\n                    if (!props.optString("countrycode").equals("MY", ignoreCase = true)) return@mapNotNull null\n                    val coords = item.getJSONObject("geometry").getJSONArray("coordinates")\n                    val address = listOf("street", "district", "city", "county", "state", "postcode")\n                        .map { props.optString(it) }.filter { it.isNotBlank() }.distinct().joinToString(", ")\n                    val name = props.optString("name").ifBlank { props.optString("street") }\n                    if (name.isBlank()) null else SearchPlace(name, address, GeoPoint(coords.getDouble(1), coords.getDouble(0)))\n                }.filter { NavigationRules.searchRank(it.name, it.address, query) < 3 }\n            } catch (_: Exception) { error = "Carian online tidak tersedia. Semak internet dan tekan CARI untuk cuba lagi."; emptyList() }\n            runOnUiThread {\n                searchInFlight = false\n                if (isFinishing || isDestroyed) return@runOnUiThread\n                if (generation == searchGeneration && !offlineMode) {\n                    publishSearchResults(query, local + remote)\n                    if (error != null) searchHint.text = if (searchPlaces.isEmpty()) error else "$error Menunjukkan POI tersimpan."\n                }\n                if (searchPending) { searchPending = false; scheduleDestinationSearch() }\n            }\n        }\n    }\n\n    private fun publishSearchResults(query: String, places: List<SearchPlace>) {\n        searchPlaces = places.distinctBy { "${it.name.lowercase(Locale.ROOT)}:${it.point.latitude}:${it.point.longitude}" }\n            .sortedWith(compareBy<SearchPlace> { NavigationRules.searchRank(it.name, it.address, query) }.thenBy { it.name })\n        searchResults.adapter = object : ArrayAdapter<SearchPlace>(this, android.R.layout.simple_list_item_2, android.R.id.text1, searchPlaces) {\n                override fun getView(position: Int, convertView: android.view.View?, parent: android.view.ViewGroup): android.view.View {\n                    val row = super.getView(position, convertView, parent)\n                    val item = getItem(position)!!\n                    row.findViewById<TextView>(android.R.id.text1).apply { text = item.name; setTextColor(Color.rgb(15, 23, 42)); textSize = 14f }\n                    row.findViewById<TextView>(android.R.id.text2).apply { text = item.address; setTextColor(Color.rgb(71, 85, 105)); textSize = 11f }\n                    return row\n                }\n            }\n        searchResults.visibility = if (searchPlaces.isEmpty()) android.view.View.GONE else android.view.View.VISIBLE\n        searchHint.visibility = android.view.View.VISIBLE\n        searchHint.text = if (searchPlaces.isEmpty()) "Tiada padanan. Cuba tambah nama negeri atau bandar." else\n            "${searchPlaces.size} padanan • Pilih destinasi • ${if (offlineMode) "POI tersimpan" else "Photon / © OpenStreetMap; maksimum 50 padanan online"}"\n    }\n\n    private fun selectSearchPlace(place: SearchPlace) {\n        searchGeneration += 1\n        searchTask?.let { uiHandler.removeCallbacks(it) }\n        suppressSearch = true\n        destinationInput.setText(place.name)\n        suppressSearch = false\n        searchResults.visibility = android.view.View.GONE\n        searchHint.visibility = android.view.View.GONE\n        (getSystemService(INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager)\n            .hideSoftInputFromWindow(destinationInput.windowToken, 0)\n        destinationInput.clearFocus()\n        if (offlineMode) {\n            followGps = false\n            map?.animateCamera(CameraUpdateFactory.newLatLngZoom(LatLng(place.point.latitude, place.point.longitude), 16.0))\n            statusText.text = "Lokasi tersimpan dipaparkan. Laluan baharu memerlukan mod Online."\n        } else findRoute(place.point)\n    }\n\n    private fun fetchJson(url: String): JSONObject {\n        if (offlineMode) throw IllegalStateException("Mod Offline")\n        val connection = (URL(url).openConnection() as HttpURLConnection).apply {\n            connectTimeout = 12000; readTimeout = 20000\n            setRequestProperty("User-Agent", "QM-NAVIGASI/2.0 Android")\n            setRequestProperty("Accept", "application/json")\n        }\n        return try {\n            if (connection.responseCode != 200) throw IllegalStateException("HTTP ${connection.responseCode}")\n            JSONObject(connection.inputStream.bufferedReader().use { it.readText() })\n        } finally { connection.disconnect() }\n    }\n\n    private fun showTrafficSettings() {\n        val input = EditText(this).apply {\n            hint = "Kunci API TomTom (Traffic + Routing)"\n            inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD\n            setText(trafficApiKey)\n        }\n        AlertDialog.Builder(this).setTitle("Trafik langsung")\n            .setMessage("Masukkan kunci API TomTom anda untuk amaran aliran perlahan di hadapan dan pilihan laluan alternatif. Lokasi di sepanjang laluan dihantar ke TomTom semasa navigasi Online. Kunci digunakan untuk sesi ini sahaja. Tiada data trafik dalam mod Offline.")\n            .setView(input).setPositiveButton("AKTIFKAN") { _, _ ->\n                tapFeedback(); trafficApiKey = input.text.toString().trim(); trafficLastCheck = 0L\n                trafficStatus.text = if (trafficApiKey.isBlank()) "Trafik langsung: belum disambung" else "Trafik © TomTom: sedia; semakan semasa navigasi Online"\n                currentLocation?.let { checkLiveTraffic(it) }\n            }.setNeutralButton("MATIKAN") { _, _ ->\n                tapFeedback(); trafficApiKey = ""; trafficDialog?.dismiss()\n                trafficStatus.text = "Trafik langsung: dimatikan"\n            }.setNegativeButton("Tutup", null).show()\n    }\n\n    private fun routeAhead(route: RouteResult, location: Location): List<GeoPoint> {\n        val points = route.coordinates\n        val nearest = points.indices.minByOrNull { distanceMeters(location.latitude, location.longitude, points[it].latitude, points[it].longitude) } ?: return emptyList()\n        if (distanceMeters(location.latitude, location.longitude, points[nearest].latitude, points[nearest].longitude) > 150.0) return emptyList()\n        var traveled = 0.0\n        val samples = mutableListOf<GeoPoint>()\n        var next = 400.0\n        for (i in nearest + 1 until points.size) {\n            val a = points[i - 1]\n            val b = points[i]\n            val length = distanceMeters(a.latitude, a.longitude, b.latitude, b.longitude)\n            while (length > 0.0 && traveled + length >= next && next <= 1800.0) {\n                val fraction = ((next - traveled) / length).coerceIn(0.0, 1.0)\n                samples.add(GeoPoint(a.latitude + (b.latitude - a.latitude) * fraction, a.longitude + (b.longitude - a.longitude) * fraction))\n                next += 700.0\n            }\n            traveled += length\n            if (next > 1800.0) break\n        }\n        return samples\n    }\n\n    private fun distanceToPolyline(point: GeoPoint, line: List<GeoPoint>): Double {\n        if (line.isEmpty()) return Double.POSITIVE_INFINITY\n        if (line.size == 1) return distanceMeters(point.latitude, point.longitude, line[0].latitude, line[0].longitude)\n        val xScale = 111320.0 * kotlin.math.cos(Math.toRadians(point.latitude))\n        var closest = Double.POSITIVE_INFINITY\n        for (i in 1 until line.size) {\n            val ax = (line[i - 1].longitude - point.longitude) * xScale\n            val ay = (line[i - 1].latitude - point.latitude) * 111320.0\n            val bx = (line[i].longitude - point.longitude) * xScale\n            val by = (line[i].latitude - point.latitude) * 111320.0\n            val dx = bx - ax; val dy = by - ay\n            val lengthSquared = dx * dx + dy * dy\n            val t = if (lengthSquared == 0.0) 0.0 else (-(ax * dx + ay * dy) / lengthSquared).coerceIn(0.0, 1.0)\n            closest = minOf(closest, kotlin.math.sqrt((ax + t * dx) * (ax + t * dx) + (ay + t * dy) * (ay + t * dy)))\n        }\n        return closest\n    }\n\n    private fun checkLiveTraffic(location: Location) {\n        if (offlineMode || !visibleActivity || !navigationStarted || trafficApiKey.isBlank() || trafficBusy || trafficDialog?.isShowing == true) return\n        val now = SystemClock.elapsedRealtime()\n        if (trafficLastCheck != 0L && now - trafficLastCheck < 90000L) return\n        val route = currentRoute ?: return\n        val samples = routeAhead(route, location)\n        if (samples.isEmpty()) return\n        val key = trafficApiKey\n        trafficLastCheck = now; trafficBusy = true\n        trafficStatus.text = "Menyemak trafik © TomTom di sepanjang laluan..."\n        networkExecutor.execute {\n            var slow = false\n            var covered = false\n            var failed = false\n            for (sample in samples) {\n                if (offlineMode || key != trafficApiKey) break\n                try {\n                    val data = fetchJson("https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/16/json?point=${sample.latitude},${sample.longitude}&unit=KMPH&key=${URLEncoder.encode(key, "UTF-8")}").getJSONObject("flowSegmentData")\n                    val coordinates = data.optJSONObject("coordinates")?.optJSONArray("coordinate") ?: continue\n                    val flowLine = (0 until coordinates.length()).map {\n                        val point = coordinates.getJSONObject(it)\n                        GeoPoint(point.getDouble("latitude"), point.getDouble("longitude"))\n                    }\n                    val onCorridor = distanceToPolyline(sample, flowLine) <= 100.0\n                    if (!onCorridor || data.optDouble("confidence") < 0.7) continue\n                    covered = true\n                    if (NavigationRules.isCongested(data.optDouble("confidence"), data.optDouble("currentSpeed"), data.optDouble("freeFlowSpeed"),\n                        data.optDouble("currentTrav