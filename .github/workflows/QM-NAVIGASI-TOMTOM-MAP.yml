name: Build QM NAVIGASI TomTom Style Map APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -q QM-NAVIGASI-Android-CloudBuild-DIAGNOSTIC.zip -d buildsrc

      - name: Fix AppCompat theme crash
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          manifest_path = Path("app/src/main/AndroidManifest.xml")
          manifest_tree = ET.parse(manifest_path)
          manifest_root = manifest_tree.getroot()
          application = manifest_root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          main_activity = next((node for node in application.iter("activity")
                                if node.get(ANDROID + "name", "").endswith("MainActivity")), None)
          activity_theme = main_activity.get(ANDROID + "theme") if main_activity is not None else None
          effective_theme = activity_theme or application.get(ANDROID + "theme")
          style_name = effective_theme[len("@style/"):] if effective_theme and effective_theme.startswith("@style/") else None
          resource_files = sorted(Path("app/src/main/res").glob("values*/*.xml"))
          changed = False
          if style_name:
              for resource_file in resource_files:
                  try:
                      resource_tree = ET.parse(resource_file)
                  except ET.ParseError:
                      continue
                  for style in resource_tree.getroot().findall("style"):
                      if style.get("name") == style_name:
                          style.set("parent", "Theme.AppCompat.Light.NoActionBar")
                          resource_tree.write(resource_file, encoding="utf-8", xml_declaration=True)
                          changed = True
          if not changed:
              values_dir = Path("app/src/main/res/values")
              values_dir.mkdir(parents=True, exist_ok=True)
              styles_path = values_dir / "styles.xml"
              if styles_path.exists():
                  styles_tree = ET.parse(styles_path)
                  styles_root = styles_tree.getroot()
              else:
                  styles_root = ET.Element("resources")
                  styles_tree = ET.ElementTree(styles_root)
              appcompat_style = next((node for node in styles_root.findall("style")
                                      if node.get("name") == "QMAppCompatTheme"), None)
              if appcompat_style is None:
                  appcompat_style = ET.SubElement(styles_root, "style", {"name": "QMAppCompatTheme"})
              appcompat_style.set("parent", "Theme.AppCompat.Light.NoActionBar")
              styles_tree.write(styles_path, encoding="utf-8", xml_declaration=True)
              if main_activity is not None:
                  main_activity.set(ANDROID + "theme", "@style/QMAppCompatTheme")
              else:
                  application.set(ANDROID + "theme", "@style/QMAppCompatTheme")
              manifest_tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Fix Kotlin single-line property
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: sed -i 's/singleLine = true/isSingleLine = true/' app/src/main/java/com/nav3dmalaysia/MainActivity.kt

      - name: Apply navigation improvements
        working-directory: buildsrc/QM-NAVIGASI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          source_path = Path("app/src/main/java/com/nav3dmalaysia/MainActivity.kt")
          source = source_path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
