                  voiceSpinnerParams.marginStart = dp(8)
                  voiceRow.addView(voiceLanguageSpinner, voiceSpinnerParams)
                  root.addView(voiceRow, LinearLayout.LayoutParams(-1, -2))
          """,
              "start and voice controls",
          )
          replace_once(
              "        nextTurnText = TextView(this).apply {\n",
              """        metricsText = TextView(this).apply {
                      text = "Kelajuan: -- km/j  •  Ke destinasi: --  •  Baki: --"
                      textSize = 12f
                      setTextColor(Color.rgb(30, 41, 59))
